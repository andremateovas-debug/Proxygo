name: proxygo
arch: amd64
platform: linux
version: 1.2.1
section: net
priority: optional
maintainer: Andre Mateo Vasquez Mosqueda / AM Devs
description: HTTP DLP proxy with a Rust inspection engine
license: Apache-2.0
contents:
  - src: ./engine-rust/target/release/proxygo-engine
    dst: /usr/bin/proxygo-engine
    file_info:
      mode: 0755
  - src: ./build/proxygo-proxy
    dst: /usr/bin/proxygo-proxy
    file_info:
      mode: 0755
  - src: ./build/proxygo-cli
    dst: /usr/bin/proxygo-cli
    file_info:
      mode: 0755
  - src: ./packaging/systemd/proxygo-engine.service
    dst: /lib/systemd/system/proxygo-engine.service
    file_info:
      mode: 0644
  - src: ./packaging/systemd/proxygo-proxy.service
    dst: /lib/systemd/system/proxygo-proxy.service
    file_info:
      mode: 0644
  - src: ./scripts/test-anomalies.sh
    dst: /usr/share/proxygo/test-anomalies.sh
    file_info:
      mode: 0755
  - src: ./LICENSE
    dst: /usr/share/doc/proxygo/LICENSE
    file_info:
      mode: 0644
  - src: ./NOTICE
    dst: /usr/share/doc/proxygo/NOTICE
    file_info:
      mode: 0644
  - src: ./docs/CA.md
    dst: /usr/share/doc/proxygo/CA.md
    file_info:
      mode: 0644
scripts:
  postinstall: ./scripts/postinstall.sh
  preremove: ./scripts/preremove.sh
  postremove: ./scripts/postremove.sh
