[package]
name = "proxygo-engine"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/scanner.rs"

[dependencies]
once_cell = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync"] }
